apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-github-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx-github-demo

  template:
    metadata:
      labels:
        app: nginx-github-demo

    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
